<div class="ruler-bar" [style.height.px]="config.rulerHeight()">
  <div
    class="ruler-canvas"
    [style.font-size.px]="config.rulerFontSize()"
    (click)="onRulerClick($event)">
    <div
      class="fluid-ruler-container"
      [style.margin-right.px]="config.viewPaddingRight()">
      <div class="ruler-grid-layer">
        @let lines = state.gridLines();
        @for (line of lines; track line.label) {
          <div
            class="ruler-tick"
            [class.is-major]="line.isMajor"
            [style.left.px]="line.x"></div>
          <span
            class="ruler-label"
            [class.is-major]="line.isMajor"
            [style.left.px]="line.x">
            {{ line.label | yearFormat }}
          </span>
        }
      </div>

      @let pX = persistentMarkerX();
      @if (pX !== null) {
        <div
          class="persistent-year-badge"
          [style.left.px]="pX"
          (click)="clearPersistentMarker($event)"
          title="Click to remove marker">
          {{ persistentMarkerLabel() }}
        </div>
      }

      @let hX = hoveredYearX();
      @if (hX !== null) {
        <div class="active-year-badge" [style.left.px]="hX">
          {{ hoveredYearLabel() }}
        </div>
      }
    </div>
  </div>
</div>
