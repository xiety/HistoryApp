<div class="ruler-bar" [style.height.px]="config.rulerHeight()">
  <div class="ruler-canvas" [style.width.px]="state.layoutWidth()" [style.font-size.px]="config.rulerFontSize()"
    (click)="onRulerClick($event)">
    <div class="ruler-grid-layer">
      @for (line of state.gridLines(); track line.label) {
      <div class="ruler-tick" [style.left.px]="line.x"></div>
      <span class="ruler-label" [style.left.px]="line.x">{{ line.label | yearFormat }}</span>
      }
    </div>

    @let pX = persistentMarkerX();
    @if (pX !== null) {
    <div class="persistent-year-badge" [style.transform]="'translateX(' + pX + 'px)'"
      (click)="clearPersistentMarker($event)" title="Click to remove marker">
      {{ persistentMarkerLabel() }}
    </div>
    }

    @let hX = hoveredYearX();
    @if (hX !== null) {
    <div class="active-year-badge" [style.transform]="'translateX(' + hX + 'px)'">
      {{ hoveredYearLabel() }}
    </div>
    }
  </div>
</div>
