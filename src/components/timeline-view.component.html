<div
  class="timeline-layout-area"
  style="width: 100%"
  [style.font-size.px]="config.baseFontSize()"
  (pointerup)="clearSelection($event)">
  <div
    class="fluid-timeline-container"
    [style.margin-right.px]="config.viewPaddingRight()"
    [style.padding-bottom.px]="config.viewPaddingBottom()">
    <app-timeline-grid [lines]="state.gridLines()"></app-timeline-grid>

    <div [style.height.px]="layout.topSpacerHeight()"></div>

    @for (category of layout.processedLayout(); track category.id) {
      <app-timeline-category [layout]="category"></app-timeline-category>
    }

    <div [style.height.px]="layout.bottomSpacerHeight()"></div>

    @if (
      layout.processedLayout().length === 0 &&
      layout.topSpacerHeight() === 0 &&
      layout.bottomSpacerHeight() === 0
    ) {
      <div class="empty-message">
        <p>No events found in this range.</p>
      </div>
    }
  </div>
</div>
