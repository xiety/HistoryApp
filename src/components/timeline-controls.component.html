<header class="top-bar">
  <div class="top-bar-content">

    <div class="branding-area">
      <button class="menu-button" (click)="ui.toggleSidebar()">
        <app-icon name="menu" [size]="20" />
      </button>
      <h1 class="app-title">Visualize History Timeline</h1>
      <a href="https://github.com/xiety/HistoryApp" target="_blank" rel="noopener noreferrer" class="repo-link">
        GitHub
      </a>
    </div>

    <div class="search-area">
      <div class="search-input-wrapper">
        <app-icon name="search" [size]="14" class="search-icon" />
        <input type="text" placeholder="Highlight events..." class="search-input" [ngModel]="state.searchQuery()"
          (ngModelChange)="state.searchQuery.set($event)" />
        @if (state.searchQuery()) {
        <div class="search-actions">
          <span class="search-count-badge">
            {{ state.matchCount() }}
          </span>
          <button class="clear-button" (click)="clearSearch()">
            <app-icon name="x" [size]="12" [strokeWidth]="3" />
          </button>
        </div>
        }
      </div>

      <div class="filter-toggle" [class.is-active]="state.isFilterMode()">
        <input type="checkbox" id="filterCheck" [ngModel]="state.isFilterMode()"
          (ngModelChange)="state.isFilterMode.set($event)" />
        <label for="filterCheck" title="Hide non-matching items">Filter View</label>
      </div>

      <div class="filter-toggle" [class.is-active]="state.hideSmallEvents()">
        <input type="checkbox" id="hideSmallCheck" [ngModel]="state.hideSmallEvents()"
          (ngModelChange)="state.hideSmallEvents.set($event)" />
        <label for="hideSmallCheck" title="Hide events smaller than 1px">Hide Small</label>
      </div>
    </div>

    <div class="controls-area">
      <div class="control-group">
        <label class="input-label">Size</label>
        <app-number-input [value]="config.baseFontSize()" (valueChange)="config.baseFontSize.set($event)" [min]="8"
          [max]="32" style="width: 70px;">
        </app-number-input>
      </div>
    </div>
  </div>
</header>
