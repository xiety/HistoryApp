<div class="grid-lines-layer">
  @for (line of lines(); track line.label) {
    <div
      class="grid-line-vertical"
      [class.is-major]="line.isMajor"
      [style.left.px]="line.x"></div>
  }
  <div class="grid-line-boundary" style="left: 0"></div>
  <div class="grid-line-boundary" style="right: 0"></div>
</div>
