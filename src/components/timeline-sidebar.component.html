@if (ui.isSidebarOpen()) {
<div class="sidebar-backdrop" (click)="ui.setSidebarOpen(false)"></div>
}

<aside class="sidebar-container" [class.is-open]="ui.isSidebarOpen()">
  <div class="sidebar-tabs">
    <button class="tab-button" [class.active]="ui.activeSidebarTab() === 'editor'" (click)="ui.setActiveTab('editor')">
      Data Editor
    </button>
    <button class="tab-button" [class.active]="ui.activeSidebarTab() === 'toc'" (click)="ui.setActiveTab('toc')">
      Table of Contents
    </button>
  </div>

  <div class="sidebar-content">
    @if (ui.activeSidebarTab() === 'editor') {
    <app-timeline-editor></app-timeline-editor>
    } @else {
    <app-timeline-toc (scrollToCategory)="onScrollToCategory($event)"></app-timeline-toc>
    }
  </div>
</aside>
